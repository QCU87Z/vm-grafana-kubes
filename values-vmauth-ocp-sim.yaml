# OVERLAY — k3d only. Layer AFTER values-vmauth.yaml. Simulates OpenShift restricted-v2
# (arbitrary high UID). Do NOT use on real OpenShift — the SCC assigns these there.
podSecurityContext:
  enabled: true
  runAsNonRoot: true
  runAsUser: 1000700000
  runAsGroup: 0
  fsGroup: 1000700000
securityContext:
  enabled: true
  runAsNonRoot: true
  runAsUser: 1000700000
  allowPrivilegeEscalation: false
  capabilities:
    drop: ["ALL"]
  seccompProfile:
    type: RuntimeDefault
